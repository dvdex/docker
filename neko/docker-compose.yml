#
# Ansible managed
#

# Labels for Traefik, Watchtower, and Autoheal
#   (docker compose ignores fields that start with `x-`. So we can use them to
#    define reusable fragments with `&anchors`. See:
#    https://docs.docker.com/compose/compose-file/11-extension/ )
x-labels: &base_labels
      homepage.name: "neko"
      homepage.href: "https://neko.kite-gila.work/"
      com.centurylinklabs.watchtower.enable: "true"
      autoheal: "true"
      homepage.group: "Media"
      homepage.description: "neko waterfox browser"
      homepage.icon: "neko"

# Reusable default networks configuration to ensure container is part of both
# the pangolin network and the default network of this compose file
x-networks: &base_networks
   
  
  pangolin_net:
    aliases:
      - neko
      

# The main Docker Compose file
services:
  neko:
    image: "ghcr.io/m1k1o/neko/waterfox:latest"
    container_name: "neko"
    shm_size: "2gb"
    ports:
#      - "8080:8080"
      - "59059:59059/udp"
      - "59059:59059/tcp"
    volumes:
      - "/volume1/docker/neko/config/policies.json:/usr/lib/waterfox/distribution/policies.json"
      - "/volume1/docker/neko/waterfox:/home/neko/waterfox" # persist waterfox settings
    environment:
      NEKO_DESKTOP_SCREEN: '1920x1080@30'
      NEKO_MEMBER_MULTIUSER_USER_PASSWORD: ${NEKO_MEMBER_MULTIUSER_USER_PASSWORD_ENV}
      NEKO_MEMBER_MULTIUSER_ADMIN_PASSWORD: ${NEKO_MEMBER_MULTIUSER_ADMIN_PASSWORD_ENV}
      NEKO_WEBRTC_UDPMUX: "59059"
      NEKO_WEBRTC_TCPMUX: "59059"
      NEKO_WEBRTC_ICELITE: 1
      NEKO_WEBRTC_NAT1TO1: "sqml01.dyndns24.ch"
    restart: on-failure:5
    labels: *base_labels
    networks: *base_networks      


networks:
  # Access the pangolin-network
  pangolin_net:
    name: pangolin
    external: true
