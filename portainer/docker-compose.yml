#
# Ansible managed
#

# Labels for Traefik, Watchtower, and Autoheal
#   (docker compose ignores fields that start with `x-`. So we can use them to
#    define reusable fragments with `&anchors`. See:
#    https://docs.docker.com/compose/compose-file/11-extension/ )
x-labels: &base_labels
      homepage.name: "portainer"
      homepage.href: "https://portainer.kite-gila.work/"
      com.centurylinklabs.watchtower.enable: "true"
      autoheal: "true"
      
      homepage.group: "Services"
      homepage.description: "Docker container management software"
      
      homepage.icon: "portainer"

# Reusable default networks configuration to ensure container is part of both
# the pangolin network and the default network of this compose file
x-networks: &base_networks
   
  
  pangolin_net:
    aliases:
      - portainer
      

# The main Docker Compose file
services:
  portainer:
    container_name: "portainer"
    image: "portainer/portainer-ee:alpine"
    ports:
      - 9443:9443
    restart: unless-stopped
    environment:
      TZ: "Europe/Berlin"
    volumes:
      - "/volume1/docker/portainer:/data:rw"
#      - "/var/run/docker.sock:/var/run/docker.sock"
    labels:
      << : *base_labels
    networks: *base_networks

networks:
  # Access the pangolin-network
  pangolin_net:
    name: pangolin
    external: true
