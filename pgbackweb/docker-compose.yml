# Labels for Traefik, Watchtower, and Autoheal
#   (docker compose ignores fields that start with `x-`. So we can use them to
#    define reusable fragments with `&anchors`. See:
#    https://docs.docker.com/compose/compose-file/11-extension/ )
x-labels: &base_labels
      homepage.name: "pgbackweb"
      homepage.href: "http://zoonas.i234.me:8095/"
      com.centurylinklabs.watchtower.enable: "true"
      autoheal: "true"
      homepage.group: "Web"
      homepage.description: "Postgres backup web UI"
      homepage.icon: "urbackup"

# Reusable default networks configuration to ensure container is part of both
# the traefik network and the default network of this compose file
x-networks: &base_networks

  db_net:
    aliases:
      - pgbackweb

# The main Docker Compose file
services:
  pgbackweb:
    image: eduardolat/pgbackweb:latest
    container_name: pgbackweb
    user: "1029:100"
    healthcheck:
      test: timeout 10s bash -c ':> /dev/tcp/127.0.0.1/8085' || exit 1
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 90s
    restart: on-failure:5
    depends_on:
      db-check-service:
        condition: service_healthy
    ports:
      - 8095:8085
    environment:
      - "TZ=Europe/Zurich"
      - "PBW_ENCRYPTION_KEY=${PBW_ENCRYPTION_KEY_ENV}"
      - "PBW_POSTGRES_CONN_STRING=${PBW_POSTGRES_CONN_STRING_ENV}"      
    volumes:
      - "/volume1/docker/backup:/backups:rw"
    labels: *base_labels
    networks: *base_networks

  db-check-service:
    image: busybox
    container_name: pgbackweb-db-check-service
    command: ["sh", "-c", "while true; do echo 'Running...'; sleep 3600; done"]
    healthcheck:
      test: ["CMD", "wget", "-O", "-", "http://pgadmin16:80/misc/ping"]
      interval: 120s
      timeout: 5s
      retries: 3
      start_period: 90s
    networks: *base_networks
    
networks:
  # Access the db-network
  db_net:
    name: db_network
    external: true
