#
# Ansible managed
#

# Labels for Traefik, Watchtower, and Autoheal
#   (docker compose ignores fields that start with `x-`. So we can use them to
#    define reusable fragments with `&anchors`. See:
#    https://docs.docker.com/compose/compose-file/11-extension/ )
x-labels: &base_labels
      homepage.name: "nexus"
      homepage.href: "https://nexus.kite-gila.work/"
      com.centurylinklabs.watchtower.enable: "true"
      autoheal: "true"
      
      homepage.group: "Services"
      homepage.description: "Nexus package repository"
      
      homepage.icon: "nexus"

# Reusable default networks configuration to ensure container is part of both
# the pangolin network and the default network of this compose file
x-networks: &base_networks
   
  
  pangolin_net:
    aliases:
      - nexus
      
  db_net:
    aliases:
      - nexus

# The main Docker Compose file
services:
  nexus:
    image: sonatype/nexus3
    container_name: "nexus"   
    restart: on-failure:5
#    ports:
#      - 8081:8081    
    environment:
      TZ: Europe/Berlin
      NEXUS_DATASTORE_NEXUS_JDBCURL: "jdbc:postgresql://postgres18:5432/nexus"
      NEXUS_DATASTORE_NEXUS_USERNAME: db_user
      NEXUS_DATASTORE_NEXUS_PASSWORD: ${DB_PASSWORD_ENV}
    volumes:
      - "nexus-data:/nexus-data"
    
    labels: *base_labels
    networks: *base_networks      

volumes:
  nexus-data: {}

networks:
  # Access the pangolin-network
  pangolin_net:
    name: pangolin
    external: true
# Access the db-network
  db_net:
    name: db_network
    external: true
