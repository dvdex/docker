#
# Ansible managed
#

# Labels for Traefik, Watchtower, and Autoheal
#   (docker compose ignores fields that start with `x-`. So we can use them to
#    define reusable fragments with `&anchors`. See:
#    https://docs.docker.com/compose/compose-file/11-extension/ )
x-labels: &base_labels
      homepage.name: "proget"
      homepage.href: "https://proget.kite-gila.work/"
      com.centurylinklabs.watchtower.enable: "true"
      autoheal: "true"
      
      homepage.group: "Services"
      homepage.description: "Proget chocolatey package repository"
      homepage.icon: "sh-jumpserver.svg"

# Reusable default networks configuration to ensure container is part of both
# the pangolin network and the default network of this compose file
x-networks: &base_networks
   
  
  pangolin_net:
    aliases:
      - proget
      
  db_net:
    aliases:
      - proget

# The main Docker Compose file
services:
  proget:
    image: proget.inedo.com/productimages/inedo/proget:latest
    container_name: "proget"
    user: "1000:1002"
    restart: on-failure:5
#      ports:
#        - "8624:80"
    environment:
      - TZ=Europe/Berlin
      # Connection string updated to match the service name 'postgres18'
      - PROGET_POSTGRES_CONNECTION_STRING=Server=postgres18;Port=5432;Database=proget;User Id=db_user;Password=${DB_PASSWORD_ENV};
      - PROGET_ENCRYPTION_KEY=${PROGET_ENCRYPTION_KEY_ENV}
    volumes:
      - "/volume1/docker/proget/packages:/var/proget/packages"
      - "/volume1/docker/backup/proget:/var/proget/backups"
    labels: *base_labels
    networks: *base_networks      


networks:
  # Access the pangolin-network
  pangolin_net:
    name: pangolin
    external: true
# Access the db-network
  db_net:
    name: db_network
    external: true
