#
# Ansible managed
#

# Labels for Traefik, Watchtower, and Autoheal
#   (docker compose ignores fields that start with `x-`. So we can use them to
#    define reusable fragments with `&anchors`. See:
#    https://docs.docker.com/compose/compose-file/11-extension/ )
x-labels: &base_labels
      homepage.name: "hawser"
      homepage.href: "https://hawser.parkhomes.work/"
      com.centurylinklabs.watchtower.enable: "true"
      autoheal: "true"
      homepage.group: "Services"
      homepage.description: "hawser agent for dockhand"
      homepage.icon: "dockhand"

# Reusable default networks configuration to ensure container is part of both
# the pangolin network and the default network of this compose file
x-networks: &base_networks
   
  
  pangolin_net:
    aliases:
      - hawser
      

# The main Docker Compose file
services:
  hawser:
    image: ghcr.io/finsys/hawser:latest
    container_name: hawser
    restart: unless-stopped
    user: 1000:989
#    ports:
#      - 2376:2376    
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - "/volume1/docker/hawser/stacks:/data/stacks"

    environment:    
      - TOKEN=${HAWSER_TOKEN_ENV}
      - DOCKER_SOCKET=/var/run/docker.sock

    labels: *base_labels
    networks: *base_networks


networks:
  # Access the pangolin-network
  pangolin_net:
    name: pangolin
    external: true
