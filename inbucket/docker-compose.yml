#
# Ansible managed
#

# Labels for Traefik, Watchtower, and Autoheal
#   (docker compose ignores fields that start with `x-`. So we can use them to
#    define reusable fragments with `&anchors`. See:
#    https://docs.docker.com/compose/compose-file/11-extension/ )
x-labels: &base_labels
      homepage.name: "inbucket"
      homepage.href: "https://webmail.parkhomes.ch/"
      pangolin.public-resources.inbucket.name: inbucket
      pangolin.public-resources.inbucket.full-domain: webmail.parkhomes.ch
      pangolin.public-resources.inbucket.protocol: http
      pangolin.public-resources.inbucket.targets[0].method: http
      pangolin.public-resources.inbucket.targets[0].hostname: inbucket
      pangolin.public-resources.inbucket.targets[0].port: 9000
      pangolin.public-resources.inbucket.auth.sso-enabled: true
      com.centurylinklabs.watchtower.enable: "true"
      autoheal: "true"
      
      homepage.group: "Services"
      homepage.description: "Disposable webmail service"
      homepage.icon: "docker-mailserver"

# Reusable default networks configuration to ensure container is part of both
# the pangolin network and the default network of this compose file
x-networks: &base_networks
   
  
  pangolin_net:
    aliases:
      - inbucket
      

# The main Docker Compose file
services:
  inbucket:
    container_name: "inbucket"
    image: "inbucket/inbucket:latest"
    expose: # Ports: SMTP, POP3
      - "2500"    
      - "1100"    
    restart: unless-stopped
    volumes:
      - "/opt/hawser-stacks/inbucket/config:/config"
      - "/opt/hawser-stacks/inbucket/storage:/storage"
    environment:
      - "INBUCKET_WEB_BASEPATH=webmail.parkhomes.ch"
    labels: *base_labels
    networks: *base_networks



networks:
  # Access the pangolin-network
  pangolin_net:
    name: pangolin
    external: true
