#
# Ansible managed
#

# Labels for Traefik, Watchtower, and Autoheal
#   (docker compose ignores fields that start with `x-`. So we can use them to
#    define reusable fragments with `&anchors`. See:
#    https://docs.docker.com/compose/compose-file/11-extension/ )
x-labels: &base_labels
      homepage.name: "pocketid"
      homepage.href: "https://pocketid.parkhomes.ch/"
      com.centurylinklabs.watchtower.enable: "true"
      autoheal: "true"
      
      homepage.group: "Services"
      homepage.description: "OIDC provider for passwordless authentication"
      homepage.icon: "sh-pocket-id.svg"

# Reusable default networks configuration to ensure container is part of both
# the pangolin network and the default network of this compose file
x-networks: &base_networks
   
  
  pangolin_net:
    aliases:
      - pocketid
      
  db_net:
    aliases:
      - pocketid

# The main Docker Compose file
services:
  pocketid:
    image: "ghcr.io/pocket-id/pocket-id:v2"
    container_name: "pocketid"  
    restart: on-failure:5
#    ports:
#      - 1411:1411
    # Optional healthcheck
    healthcheck:
      test: [ "CMD", "/app/pocket-id", "healthcheck" ]
      interval: 1m30s
      timeout: 5s
      retries: 2
      start_period: 10s
    environment:
      TZ: Europe/Zurich
      PUID: 1001 
      PGID: 989 
      APP_URL: "https://pocketid.parkhomes.ch"
      TRUST_PROXY: false
      ANALYTICS_DISABLED: true
      MAXMIND_LICENSE_KEY: ${MAXMIND_LICENSE_KEY_ENV}
      DB_PROVIDER: postgres
      DB_CONNECTION_STRING: ${DB_CONNECTION_STRING_ENV}
      KEYS_STORAGE: database
      ENCRYPTION_KEY: ${ENCRYPTION_KEY_ENV}

    volumes:
      - "./data:/app/data"
    
    labels: *base_labels
    networks: *base_networks    

networks:
  # Access the pangolin-network
  pangolin_net:
    name: pangolin
    external: true
# Access the db-network
  db_net:
    name: db_network
    external: true
