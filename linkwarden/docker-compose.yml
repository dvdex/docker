#
# Ansible managed
#

# Labels for Traefik, Watchtower, and Autoheal
#   (docker compose ignores fields that start with `x-`. So we can use them to
#    define reusable fragments with `&anchors`. See:
#    https://docs.docker.com/compose/compose-file/11-extension/ )
x-labels: &base_labels
      traefik.enable: "true"
      traefik.docker.network: "traefik_network"
      traefik.http.services.linkwarden.loadbalancer.server.port: "3000"
      traefik.http.routers.linkwarden_web.EntryPoints: "web-secure"
      traefik.http.routers.linkwarden_web.rule: "Host(`linkwarden.kite-gila.work`)"
      homepage.name: "linkwarden"
      homepage.href: "https://linkwarden.kite-gila.work/"
      traefik.http.routers.linkwarden_web.service: "linkwarden"
      traefik.http.routers.linkwarden_web.tls: true
      traefik.http.routers.linkwarden_web.tls.certresolver: "default"
      com.centurylinklabs.watchtower.enable: "true"
      autoheal: "true"
      homepage.group: "Media"
      homepage.description: "Collaborative bookmark manager"   
      homepage.icon: "linkwarden"

# Reusable default networks configuration to ensure container is part of both
# the traefik network and the default network of this compose file
x-networks: &base_networks
  traefik_net:
    aliases:
      - linkwarden
      
  db_net:
    aliases:
      - linkwarden

# The main Docker Compose file
services:
  linkwarden:
    image: ghcr.io/linkwarden/linkwarden:latest
    container_name: "linkwarden"
#    user: "1000:1002"
    healthcheck:
      test: timeout 10s bash -c ':> /dev/tcp/127.0.0.1/3000' || exit 1
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 90s
    mem_limit: 2g
    cpu_shares: 768
    security_opt:
      - no-new-privileges:true
    volumes:
      - "/volume1/docker/linkwarden/data:/data/data:rw"
    environment:
      - "DATABASE_URL=${LW_POSTGRES_CONN_STRING_ENV}"
      - "NEXTAUTH_SECRET=${LW_NEXTAUTH_SECRET_ENV}"
      - "NEXTAUTH_URL=https://linkwarden.kite-gila.work/api/v1/auth"
      - "NEXT_PUBLIC_KEYCLOAK_ENABLED=true"
      - "KEYCLOAK_CUSTOM_NAME=Pocket ID"
      - "KEYCLOAK_ISSUER=https://pocketid.zoonas.i234.me"
      - "KEYCLOAK_CLIENT_ID=${LW_CLIENT_ID_ENV}"
      - "KEYCLOAK_CLIENT_SECRET=${LW_CLIENT_SECRET_ENV}"
# Additional Optional Settings
#      PAGINATION_TAKE_COUNT: 
#      STORAGE_FOLDER: 
#      AUTOSCROLL_TIMEOUT: 
      - NEXT_PUBLIC_DISABLE_REGISTRATION=true #or false
    restart: on-failure:5
    labels: *base_labels
    networks: *base_networks

networks:
  # Access the traefik-network
  traefik_net:
    name: traefik_network
    external: true
# Access the db-network
  db_net:
    name: db_network
    external: true
