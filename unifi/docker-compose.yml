# Labels for Traefik, Watchtower, and Autoheal
#   (docker compose ignores fields that start with `x-`. So we can use them to
#    define reusable fragments with `&anchors`. See:
#    https://docs.docker.com/compose/compose-file/11-extension/ )
x-labels: &base_labels
      com.centurylinklabs.watchtower.enable: "true"
      autoheal: "true"
      homepage.group: "Web"
      homepage.description: "UniFi Network Controller"
      homepage.icon: "unifi"
      homepage.href: "https://unifi.tapir-boa.work:8443/"

# Reusable default networks configuration to ensure container is part of both
# the traefik network and the default network of this compose file
x-networks: &base_networks
  default:


# The main Docker Compose file
services:
  unifi:
    image: "ryansch/unifi-rpi:latest"
    container_name: "unifi"
    restart: unless-stopped
    environment:
      JAVA_OPTS: -Xmx1024M
    ports:
      - "3478:3478/udp"
      - "8080:8080"
      - "8443:8443"
      - "8880:8880"
      - "8843:8843"
      - "6789:6789"
    volumes:
      # Unifi v5.0.7 creates all of these directories (some remain empty)
      - "/volume1/docker/unifi/config:/var/lib/unifi"
      - "/volume1/docker/unifi/log:/usr/lib/unifi/logs"
      - "/volume1/docker/unifi/log2:/var/log/unifi"
      - "/volume1/docker/unifi/run:/usr/lib/unifi/run"
      - "/volume1/docker/unifi/run2:/run/unifi"
      - "/volume1/docker/unifi/work:/usr/lib/unifi/work"
    labels: *base_labels
    networks: *base_networks
	