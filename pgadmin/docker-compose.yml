#
# Ansible managed
#

# Labels for Traefik, Watchtower, and Autoheal
#   (docker compose ignores fields that start with `x-`. So we can use them to
#    define reusable fragments with `&anchors`. See:
#    https://docs.docker.com/compose/compose-file/11-extension/ )
x-labels: &base_labels
      homepage.name: "pgadmin"
      homepage.href: "https://pgadmin.parkhomes.ch/"
      com.centurylinklabs.watchtower.enable: "true"
      autoheal: "true"
      homepage.group: "Web"
      homepage.description: "Postgres administration web UI"
      homepage.icon: "postgres"

# Reusable default networks configuration to ensure container is part of both
# the pangolin network and the default network of this compose file
x-networks: &base_networks
   
  
  pangolin_net:
    aliases:
      - pgadmin
      
  db_net:
    aliases:
      - pgadmin

# The main Docker Compose file
services:
  postgres16:
    container_name: postgres16
    user: "1001:989"
    image: postgres:16
    mem_limit: 1g
    cpu_shares: 768
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "pg_isready", "-q", "-d", "postgres", "-U", "basync"]
      timeout: 45s
      interval: 10s
      retries: 10
    restart: on-failure:5
    volumes:
      - "./config/init.sql:/docker-entrypoint-initdb.d/init.sql"
      - "./data:/var/lib/postgresql/data"
    environment:
      - "TZ=Europe/Zurich"
      - "POSTGRES_USER=${POSTGRES_USER_ENV}"
      - "POSTGRES_PASSWORD=${POSTGRES_PASSWORD_ENV}"   
    networks: *base_networks

  postgres18:
    container_name: postgres18
    user: "1001:989"
    image: postgres:18
    mem_limit: 1g
    cpu_shares: 768
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "pg_isready", "-q", "-d", "postgres", "-U", "basync"]
      timeout: 45s
      interval: 10s
      retries: 10
    restart: on-failure:5
    volumes:
      - "./config/init.sql:/docker-entrypoint-initdb.d/init.sql"
      - "./postgresql:/var/lib/postgresql:rw"
    environment:
      - "TZ=Europe/Zurich"
      - "POSTGRES_USER=${POSTGRES_USER_ENV}"
      - "POSTGRES_PASSWORD=${POSTGRES_PASSWORD_ENV}"   
    networks: *base_networks
  
  pgadmin:
    image: "dpage/pgadmin4:latest"
    container_name: "pgadmin"
    user: "1001:989"
    healthcheck:
      test: ["CMD", "wget", "-O", "-", "http://localhost:80/misc/ping"]
      interval: 300s
      timeout: 5s
      retries: 3
      start_period: 90s
    restart: on-failure:5
#    ports:
#      - 8096:80    
    volumes:
      - "./pgadmin-data:/var/lib/pgadmin"
      - "./log:/var/log"
      - "./pgadmin-data/config_local.py:/pgadmin4/config_local.py"
    environment:
      - "PGADMIN_DEFAULT_EMAIL=${PGADMIN_DEFAULT_EMAIL_ENV}"
      - "PGADMIN_DEFAULT_PASSWORD=${PGADMIN_DEFAULT_PASSWORD_ENV}"
    labels: *base_labels
    networks: *base_networks

networks:
  # Access the pangolin-network
  pangolin_net:
    name: pangolin
    external: true
# Access the db-network
  db_net:
    name: db_network
    external: true
