# Labels for Traefik, Watchtower, and Autoheal
#   (docker compose ignores fields that start with `x-`. So we can use them to
#    define reusable fragments with `&anchors`. See:
#    https://docs.docker.com/compose/compose-file/11-extension/ )
x-labels: &base_labels
      homepage.name: "mealie"
      homepage.href: "https://mealie.zoonas.i234.me/"
      com.centurylinklabs.watchtower.enable: "true"
      autoheal: "true"
      homepage.group: "Media"
      homepage.description: "recipe management"
      homepage.icon: "mealie"

# Reusable default networks configuration to ensure container is part of both
# the traefik network and the default network of this compose file
x-networks: &base_networks
  default:
      

# The main Docker Compose file
services:
  mealie:
    image: "ghcr.io/mealie-recipes/mealie:latest"
    container_name: "mealie"
    security_opt:
      - no-new-privileges:true
    read_only: false
    healthcheck:
      test: timeout 10s bash -c ':> /dev/tcp/127.0.0.1/9000' || exit 1
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 90s  
    ports:
      - 9925:9000
    restart: on-failure:5
    environment:
      TZ: Europe/Zurich
      PUID: 1029 
      PGID: 100       
      MAX_WORKERS: 1
      WEB_CONCURRENCY: 1
      ALLOW_SIGNUP: true #or false
      BASE_URL: https://mealie.zoonas.i234.me
      SMTP_HOST: "192.168.178.24"
      SMTP_PORT: 2500
      SMTP_FROM_NAME: Mealie
      SMTP_AUTH_STRATEGY: NONE # Options: TLS, SSL, NONE
      SMTP_FROM_EMAIL: "mealie@mealie.zoonas.i234.me"
      SMTP_USER: ""
      SMTP_PASSWORD: ""
      OIDC_AUTH_ENABLED: true
      OIDC_SIGNUP_ENABLED: true
      OIDC_CONFIGURATION_URL: "https://pocketid.zoonas.i234.me/.well-known/openid-configuration"
      OIDC_CLIENT_ID: ${MEALIE_CLIENT_ID_ENV}
      OIDC_CLIENT_SECRET: ${MEALIE_CLIENT_SECRET_ENV}

    volumes:
      - "/volume1/docker/mealie/data:/app/data/:rw"

    labels: *base_labels
    networks: *base_networks

