#
# Ansible managed
#

# Labels for Traefik, Watchtower, and Autoheal
#   (docker compose ignores fields that start with `x-`. So we can use them to
#    define reusable fragments with `&anchors`. See:
#    https://docs.docker.com/compose/compose-file/11-extension/ )
x-labels: &base_labels
      traefik.enable: "true"
      traefik.docker.network: "traefik_network"
      traefik.http.services.freshrss.loadbalancer.server.port: "80"
      traefik.http.routers.freshrss_web.EntryPoints: "web-secure"
      traefik.http.routers.freshrss_web.rule: "Host(`rss.tapir-boa.work`)"
      homepage.name: "freshrss"
      homepage.href: "https://rss.tapir-boa.work/"
      traefik.http.routers.freshrss_web.service: "freshrss"
      traefik.http.routers.freshrss_web.tls: true
      traefik.http.routers.freshrss_web.tls.certresolver: "default"
      com.centurylinklabs.watchtower.enable: "true"
      autoheal: "true"
      
      homepage.group: "Services"
      homepage.description: "RSS feed aggregator"
      
      homepage.icon: "freshrss"

# Reusable default networks configuration to ensure container is part of both
# the traefik network and the default network of this compose file
x-networks: &base_networks
  default:
  
  traefik_net:
    aliases:
      - freshrss
      
  db_net:
    aliases:
      - freshrss

# The main Docker Compose file
services:
  freshrss:
    image: "ghcr.io/linuxserver/freshrss:1.25.0"
    container_name: "freshrss"
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-fs", "-S", "--max-time", "2", "http://localhost:80"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s      
    restart: on-failure:5
#    ports:
#      - 8098:80    
    logging:
      options:
        max-size: 10m
    environment:
      TZ: Europe/Berlin
      CRON_MIN: 3,33
      PUID: 1000 
      PGID: 109 
      BASE_URL: "https://rss.tapir-boa.work"
      SERVER_DNS: "rss.tapir-boa.work"
      ADMIN_EMAIL: ${ADMIN_EMAIL_ENV}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD_ENV}
      ADMIN_API_PASSWORD: ${ADMIN_API_PASSWORD_ENV}
      TRUSTED_PROXY: 100.64.0.0/10
      DB_HOST: postgres16:5432
      DB_BASE: freshrss
      DB_USER: freshrss_user
      DB_PASSWORD: ${DB_PASSWORD_ENV}
    volumes:
      - "/volume1/docker/freshrss/config:/config:rw"
    
    labels: *base_labels
    networks: *base_networks      



networks:
  # Access the traefik-network
  traefik_net:
    name: traefik_network
    external: true
# Access the db-network
  db_net:
    name: db_network
    external: true
