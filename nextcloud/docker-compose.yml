name: nextcloud-aio

services:
  nextcloud-aio-mastercontainer:
    image: ghcr.io/nextcloud-releases/all-in-one:${NEXTCLOUD_AIO_TAG}
    container_name: nextcloud-aio-mastercontainer
    init: true
    restart: always
    ports:
      - "${NEXTCLOUD_AIO_PORT}:8080"
    volumes:
      - nextcloud_aio_mastercontainer:/mnt/docker-aio-config
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      TZ: ${TZ}
      APACHE_PORT: ${NEXTCLOUD_APACHE_PORT}
      APACHE_IP_BINDING: 0.0.0.0
      APACHE_ADDITIONAL_NETWORK: pangolin
      NEXTCLOUD_DATADIR: "${DATA_ROOT}/nextcloud/ncdata"
      SKIP_DOMAIN_VALIDATION: ${NEXTCLOUD_SKIP_DOMAIN_VALIDATION:-false}
      TALK_PORT: ${NEXTCLOUD_TALK_PORT}
    labels:
      - "pangolin.public-resources.${SITE_ID}-nextcloud.name=Nextcloud"
      - "pangolin.public-resources.${SITE_ID}-nextcloud.full-domain=${NEXTCLOUD_DOMAIN}"
      - "pangolin.public-resources.${SITE_ID}-nextcloud.mode=http"
      - "pangolin.public-resources.${SITE_ID}-nextcloud.auth.sso-enabled=${PANGOLIN_SSO:-false}"
      - "pangolin.public-resources.${SITE_ID}-nextcloud.targets[0].method=http"
      - "pangolin.public-resources.${SITE_ID}-nextcloud.targets[0].hostname=nextcloud-aio-apache"
      - "pangolin.public-resources.${SITE_ID}-nextcloud.targets[0].port=${NEXTCLOUD_APACHE_PORT}"
      - "homepage.name=Nextcloud"
      - "homepage.href=https://${NEXTCLOUD_DOMAIN}/"
      - "homepage.group=Media"
      - "homepage.description=File sync and collaboration"
      - "homepage.icon=nextcloud"
    networks:
      - pangolin

volumes:
  nextcloud_aio_mastercontainer:
    name: nextcloud_aio_mastercontainer

networks:
  pangolin:
    name: pangolin
    external: true
