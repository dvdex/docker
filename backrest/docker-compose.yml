# Ansible managed
#

# Labels for Traefik, Watchtower, and Autoheal
#   (docker compose ignores fields that start with `x-`. So we can use them to
#    define reusable fragments with `&anchors`. See:
#    https://docs.docker.com/compose/compose-file/11-extension/ )
x-labels: &base_labels
      traefik.enable: "true"
      traefik.docker.network: "traefik_network"
      traefik.http.services.backrest.loadbalancer.server.port: "9898"
      traefik.http.routers.backrest_web.EntryPoints: "web-secure"
      traefik.http.routers.backrest_web.rule: "Host(`backrest.kite-gila.work`)"
      homepage.name: "backrest"
      homepage.href: "https://backrest.kite-gila.work/"
      traefik.http.routers.backrest_web.service: "backrest"
      traefik.http.routers.backrest_web.tls: true
      traefik.http.routers.backrest_web.tls.certresolver: "default"
      com.centurylinklabs.watchtower.enable: "true"
      autoheal: "true"
      homepage.group: "Web"
      homepage.description: "Restic Backup web UI"
      homepage.icon: "restic"

# Reusable default networks configuration to ensure container is part of both
# the traefik network and the default network of this compose file
x-networks: &base_networks

  traefik_net:
    aliases:
      - backrest


# The main Docker Compose file
services:
  backrest:
    image: garethgeorge/backrest:latest
    container_name: "backrest"
#    user: "1000:1002"
    restart: unless-stopped
    environment:
      - TZ=Europe/Berlin
      - BACKREST_DATA=/data # path for backrest data. restic binary and the database are placed here.
      - BACKREST_CONFIG=/config/config.json # path for the backrest config file.
      - XDG_CACHE_HOME=/cache # path for the restic cache which greatly improves performance.
      - BACKREST_PORT=9898
      - AZURE_ACCOUNT_NAME=${AZURE_ACCOUNT_NAME_ENV}
      - AZURE_ACCOUNT_KEY=${AZURE_ACCOUNT_KEY_ENV}
    volumes:
      - "/volume1/docker/backrest/data:/data"
      - "/volume1/docker/backrest/config:/config"
      - "/volume1/docker/backrest/cache:/cache"
      - "/volume1/docker/backrest/ssh:/root/.ssh:rw"
      - "/volume1/docker/backup:/userdata:ro"
    labels: *base_labels
    networks: *base_networks


networks:
  # Access the traefik-network
  traefik_net:
    name: traefik_network
    external: true
