#
# Ansible managed
#

# Labels for Traefik, Watchtower, and Autoheal
#   (docker compose ignores fields that start with `x-`. So we can use them to
#    define reusable fragments with `&anchors`. See:
#    https://docs.docker.com/compose/compose-file/11-extension/ )
x-labels: &base_labels
      homepage.name: "paperlessai"
      homepage.href: "https://paperlessai.kite-gila.work/"
      com.centurylinklabs.watchtower.enable: "true"
      autoheal: "true"
      homepage.group: "Media"
      homepage.description: "Document management system with AI"
      homepage.icon: "paperless"

# Reusable default networks configuration to ensure container is part of both
# the pangolin network and the default network of this compose file
x-networks: &base_networks
   
  
  pangolin_net:
    aliases:
      - paperlessai
      

# The main Docker Compose file
services:
  paperlessai:
    container_name: "paperlessai"
    image: "clusterzx/paperless-ai:latest"
    restart: unless-stopped
    security_opt:
      - no-new-privileges=true
    ports:
      - 3002:3002      
    environment:
      - PUID=1000
      - PGID=1002
      - PAPERLESS_AI_PORT=3002
      - RAG_SERVICE_URL=http://localhost:8000
      - RAG_SERVICE_ENABLED=true

    volumes:
      - "/volume1/docker/paperlessai/data:/app/data"

    labels: *base_labels
    networks: *base_networks


networks:
  # Access the pangolin-network
  pangolin_net:
    name: pangolin
    external: true
