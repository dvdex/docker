#
# Ansible managed
#

# Labels for Traefik, Watchtower, and Autoheal
#   (docker compose ignores fields that start with `x-`. So we can use them to
#    define reusable fragments with `&anchors`. See:
#    https://docs.docker.com/compose/compose-file/11-extension/ )
x-labels: &base_labels
      homepage.name: "homepage"
      homepage.href: "https://home.parkhomes.ch/"
      com.centurylinklabs.watchtower.enable: "true"
      autoheal: "true"
      homepage.group: ""
      
      homepage.icon: "homepage"

# Reusable default networks configuration to ensure container is part of both
# the pangolin network and the default network of this compose file
x-networks: &base_networks
  default:
   
  
  pangolin_net:
    aliases:
      - homepage
      

# The main Docker Compose file
services:
  dockerproxy:
    image: ghcr.io/tecnativa/docker-socket-proxy:0.3.0
    container_name: dockerproxy
    environment:
      - CONTAINERS=1 # Allow access to viewing containers
      - SERVICES=1 # Allow access to viewing services (necessary when using Docker Swarm)
      - TASKS=1 # Allow access to viewing tasks (necessary when using Docker Swarm)
      - POST=0 # Disallow any POST operations (effectively read-only)
    ports:
      - 127.0.0.1:2375:2375
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro # Mounted as read-only
    restart: unless-stopped

  homepage:
    container_name: "homepage"
    image: ghcr.io/gethomepage/homepage:latest
    mem_limit: 4g
    cpu_shares: 768
    security_opt:
      - no-new-privileges:true
    restart: on-failure:5
#    ports:
#      - 3550:3000
    environment:
      PUID: "1001"
      PGID: "989"
      HOMEPAGE_ALLOWED_HOSTS: "home.parkhomes.ch"
    volumes:
      - "./config:/app/config:rw"
      - "./public:/app/public/images:rw"
    labels: *base_labels
    networks: *base_networks


networks:
  # Access the pangolin-network
  pangolin_net:
    name: pangolin
    external: true
