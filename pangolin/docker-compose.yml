#
# Ansible managed
#

# Labels for Traefik, Watchtower, and Autoheal
#   (docker compose ignores fields that start with `x-`. So we can use them to
#    define reusable fragments with `&anchors`. See:
#    https://docs.docker.com/compose/compose-file/11-extension/ )
x-labels: &base_labels
      homepage.name: "pangolin"
      homepage.href: "https://pangolin.parkhomes.work/"
      com.centurylinklabs.watchtower.enable: "true"
      autoheal: "true"
      
      homepage.group: "Services"
      
      homepage.icon: "pangolin"

# Reusable default networks configuration to ensure container is part of both
# the pangolin network and the default network of this compose file
x-networks: &base_networks
   
  
  pangolin_net:
    aliases:
      - pangolin
      

# The main Docker Compose file
services:
  pangolin:
    image: ghcr.io/fosrl/pangolin:latest
    container_name: pangolin
    restart: unless-stopped
    volumes:
      - "/volume1/docker/pangolin/config:/app/config"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/v1/"]
      interval: "10s"
      timeout: "10s"
      retries: 15
    labels: *base_labels
    networks: *base_networks

  gerbil:
    image: ghcr.io/fosrl/gerbil:latest
    container_name: gerbil
    restart: unless-stopped
    depends_on:
      pangolin:
        condition: service_healthy
    command:
      - --reachableAt=http://gerbil:3004
      - --generateAndSaveKeyTo=/var/config/key
      - --remoteConfig=http://pangolin:3001/api/v1/
    volumes:
      - "/volume1/docker/pangolin/config/:/var/config"
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    ports:
      - 51820:51820/udp
      - 21820:21820/udp
      - 443:443 # Port for traefik because of the network_mode
      - 80:80 # Port for traefik because of the network_mode
    networks: *base_networks      

  traefik:
    image: public.ecr.aws/docker/library/traefik:v3.6
    container_name: traefik
    restart: unless-stopped
    network_mode: service:gerbil # Ports appear on the gerbil service    

    environment:
      PUID: "1000"
      PGID: "989"
      TZ: "Europe/Berlin"

    depends_on:
      pangolin:
        condition: service_healthy
    command:
      - --configFile=/etc/traefik/traefik_config.yml
    volumes:
      - "/volume1/docker/pangolin/config/traefik:/etc/traefik:ro" # Volume to store the Traefik configuration
      - "/volume1/docker/pangolin/config/letsencrypt:/letsencrypt" # Volume to store the Let's Encrypt certificates
      - "/volume1/docker/pangolin/config/traefik/logs:/var/log/traefik" # Volume to store Traefik logs

#networks:
#  default:
#    driver: bridge
#    name: pangolin
#    enable_ipv6: false
 


networks:
  # Access the pangolin-network
  pangolin_net:
    name: pangolin
    external: true
