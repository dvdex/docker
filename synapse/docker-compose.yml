#
# Ansible managed
#

# Labels for Traefik, Watchtower, and Autoheal
#   (docker compose ignores fields that start with `x-`. So we can use them to
#    define reusable fragments with `&anchors`. See:
#    https://docs.docker.com/compose/compose-file/11-extension/ )
x-labels: &base_labels
      homepage.name: "synapse"
      homepage.href: "https://chat.kite-gila.work/"
      com.centurylinklabs.watchtower.enable: "true"
      autoheal: "true"
      homepage.group: "Services"
      homepage.description: "Matrix protocol server"
      homepage.icon: "matrix"

# Reusable default networks configuration to ensure container is part of both
# the pangolin network and the default network of this compose file
x-networks: &base_networks
   
  
  pangolin_net:
    aliases:
      - synapse
      
  db_net:
    aliases:
      - synapse

# The main Docker Compose file
services:
  synapse:
    image: matrixdotorg/synapse:latest
    container_name: synapse
    security_opt:
      - no-new-privileges:true
    user: 1000:1002
    ports:
      - 8450:8008      
    volumes:
      - "/volume1/docker/synapse/data:/data:rw"
    environment:
      TZ: Europe/Berlin
      SYNAPSE_CONFIG_PATH: /data/homeserver.yaml
      SYNAPSE_SERVER_NAME: chat.kite-gila.work

    restart: on-failure:5
    labels: *base_labels
    networks: *base_networks



networks:
  # Access the pangolin-network
  pangolin_net:
    name: pangolin
    external: true
# Access the db-network
  db_net:
    name: db_network
    external: true
